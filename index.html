<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donut SMP — Trade Logger</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3a;
      --accent:  #f97316;
      --green:   #22c55e;
      --red:     #ef4444;
      --muted:   #6b7280;
      --text:    #e5e7eb;
      --sub:     #9ca3af;
      --radius:  10px;
      --font:    'Segoe UI', system-ui, sans-serif;
    }

    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 24px 16px; }

    header { max-width: 1100px; margin: 0 auto 32px; display: flex; align-items: center; gap: 14px; }
    .logo  { font-size: 2rem; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p  { font-size: .85rem; color: var(--sub); margin-top: 2px; }

    main { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

    /* Cards */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card  { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
    .card .label { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
    .card .value { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card.profit .value { color: var(--green); }
    .card.loss   .value { color: var(--red); }
    .card.net    .value { color: var(--accent); }

    /* Form */
    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; }
    .form-card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
    .form-row  { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .field     { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: .75rem; color: var(--sub); text-transform: uppercase; letter-spacing: .05em; }
    .field input, .field select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 8px 10px; font-size: .9rem; font-family: inherit;
      outline: none; transition: border-color .15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field.grow { flex: 1; min-width: 120px; }
    .field.grow input { width: 100%; }
    .field.sm input { width: 90px; }
    .btn { padding: 9px 20px; border: none; border-radius: 6px; font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-log   { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--border); color: var(--sub); font-size: .82rem; }
    .hint { margin-top: 10px; font-size: .82rem; color: var(--red); min-height: 1.2em; }

    /* Tables */
    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .table-top  { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); gap: 8px; }
    .table-top h2 { font-size: 1rem; font-weight: 600; }
    .table-top-right { display: flex; gap: 8px; align-items: center; }
    .badge { background: var(--border); color: var(--sub); font-size: .75rem; padding: 2px 8px; border-radius: 20px; }
    .btn-sm { padding: 5px 12px; font-size: .78rem; }

    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    thead { background: rgba(255,255,255,.03); }
    th { padding: 10px 16px; text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; }
    td { padding: 10px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,.02); }

    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .72rem; font-weight: 700; text-transform: uppercase; }
    .tag-buy  { background: rgba(34,197,94,.15); color: var(--green); }
    .tag-sell { background: rgba(239,68,68,.15);  color: var(--red); }
    .pos { color: var(--green); font-weight: 600; }
    .neg { color: var(--red);   font-weight: 600; }
    .dim { color: var(--muted); }

    .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: .85rem; line-height: 1; }
    .del-btn:hover { background: rgba(239,68,68,.15); color: var(--red); }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .empty   { padding: 32px 20px; text-align: center; color: var(--muted); font-size: .875rem; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px; max-width: 340px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 12px 18px; border-radius: var(--radius);
      font-size: .875rem; transform: translateY(80px); opacity: 0;
      transition: all .25s ease; z-index: 99; pointer-events: none;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 700px) {
      .cards { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .form-row { flex-direction: column; }
      .field.sm input { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">🍩</span>
  <div>
    <h1>Donut SMP — Trade Logger</h1>
    <p>Track your auction-house flips &amp; profit/loss</p>
  </div>
</header>

<main>

  <div class="cards">
    <div class="card profit"><div class="label">Total Profit</div><div class="value" id="totalProfit">—</div></div>
    <div class="card loss">  <div class="label">Total Loss</div>  <div class="value" id="totalLoss">—</div></div>
    <div class="card net">   <div class="label">Net P&amp;L</div> <div class="value" id="netPnl">—</div></div>
  </div>

  <div class="form-card">
    <h2>Log a Trade</h2>
    <div class="form-row">
      <div class="field">
        <label>Action</label>
        <select id="action">
          <option value="BUY">BUY</option>
          <option value="SELL">SELL</option>
        </select>
      </div>
      <div class="field sm">
        <label>Qty</label>
        <input type="number" id="qty" placeholder="5" min="0.01" step="any">
      </div>
      <div class="field grow">
        <label>Item</label>
        <input type="text" id="item" placeholder="Spawner" autocomplete="off" list="item-suggestions">
        <datalist id="item-suggestions"></datalist>
      </div>
      <div class="field sm">
        <label>Price each</label>
        <input type="number" id="price" placeholder="64" min="0" step="any">
      </div>
      <button class="btn btn-log" id="logBtn" onclick="logTrade()">Log</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <div class="two-col">

    <div class="table-card">
      <div class="table-top">
        <h2>Trade History</h2>
        <div class="table-top-right">
          <span class="badge" id="tradeCount">0 trades</span>
          <button class="btn btn-ghost btn-sm" onclick="exportCsv()">Export CSV</button>
        </div>
      </div>
      <div id="tradeTableWrap"><p class="empty">No trades yet — log one above.</p></div>
    </div>

    <div class="table-card">
      <div class="table-top">
        <h2>Inventory</h2>
        <span class="badge" id="invCount">0 items</span>
      </div>
      <div id="invTableWrap"><p class="empty">Nothing held yet.</p></div>
    </div>

  </div>

</main>

<div id="toast"></div>

<script>
  // ── API calls ───────────────────────────────────────────────────────────────
  const api = (path, opts) => fetch(path, opts).then(r => r.json());

  async function loadAll() {
    const [trades, inv, summary] = await Promise.all([
      api('/api/trades'),
      api('/api/inventory'),
      api('/api/summary'),
    ]);
    renderSummary(summary);
    renderTrades(trades);
    renderInventory(inv);
    populateSuggestions(inv);
  }

  async function logTrade() {
    const action = document.getElementById('action').value;
    const item   = document.getElementById('item').value.trim();
    const qty    = parseFloat(document.getElementById('qty').value);
    const price  = parseFloat(document.getElementById('price').value);

    if (!item || isNaN(qty) || qty <= 0 || isNaN(price) || price < 0) {
      document.getElementById('hint').textContent = 'Fill in item, qty, and price.';
      return;
    }
    document.getElementById('hint').textContent = '';

    const btn = document.getElementById('logBtn');
    btn.disabled = true;

    const res = await api('/api/trades', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, item, qty, price }),
    });

    btn.disabled = false;

    if (res.error) { document.getElementById('hint').textContent = res.error; return; }

    ['qty', 'item', 'price'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('item').focus();
    toast(action === 'BUY'
      ? `✅ Bought ${qty} ${item} @ ${price}`
      : `✅ Sold ${qty} ${item} @ ${price}`);
    loadAll();
  }

  async function deleteTrade(id) {
    if (!confirm('Delete this trade? Inventory will be recalculated.')) return;
    await api(`/api/trades/${id}`, { method: 'DELETE' });
    loadAll();
  }

  function exportCsv() { window.location = '/api/export'; }

  // ── Render ──────────────────────────────────────────────────────────────────
  function fmt(n)    { return Math.round(n).toLocaleString(); }
  function fmtD(n)   { return (+n).toLocaleString(undefined, { maximumFractionDigits: 2 }); }

  function renderSummary({ totalProfit, totalLoss, netPnl }) {
    document.getElementById('totalProfit').textContent = fmt(totalProfit);
    document.getElementById('totalLoss').textContent   = fmt(totalLoss);
    const el = document.getElementById('netPnl');
    el.textContent  = (netPnl >= 0 ? '+' : '') + fmt(netPnl);
    el.style.color  = netPnl >= 0 ? 'var(--green)' : 'var(--red)';
  }

  function renderTrades(trades) {
    const wrap = document.getElementById('tradeTableWrap');
    document.getElementById('tradeCount').textContent = `${trades.length} trade${trades.length !== 1 ? 's' : ''}`;
    if (!trades.length) { wrap.innerHTML = '<p class="empty">No trades yet — log one above.</p>'; return; }

    wrap.innerHTML = `<table>
      <thead><tr><th>Date</th><th>Action</th><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th>Profit</th><th></th></tr></thead>
      <tbody>${trades.map(t => `<tr>
        <td class="dim" style="font-size:.8rem">${t.date}</td>
        <td><span class="tag tag-${t.action.toLowerCase()}">${t.action}</span></td>
        <td>${t.item}</td>
        <td>${fmtD(t.qty)}</td>
        <td>${fmtD(t.price)}</td>
        <td>${fmt(t.total)}</td>
        <td>${t.profit != null
          ? `<span class="${t.profit >= 0 ? 'pos' : 'neg'}">${t.profit >= 0 ? '+' : ''}${fmt(t.profit)}</span>`
          : '<span class="dim">—</span>'}</td>
        <td><button class="del-btn" onclick="deleteTrade(${t.id})" title="Delete">✕</button></td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  function renderInventory(inv) {
    const wrap = document.getElementById('invTableWrap');
    document.getElementById('invCount').textContent = `${inv.length} item${inv.length !== 1 ? 's' : ''}`;
    if (!inv.length) { wrap.innerHTML = '<p class="empty">Nothing held yet.</p>'; return; }

    wrap.innerHTML = `<table>
      <thead><tr><th>Item</th><th>Qty Held</th><th>Avg Cost</th><th>Total Value</th></tr></thead>
      <tbody>${inv.map(r => `<tr>
        <td>${r.item}</td>
        <td>${fmtD(r.qty)}</td>
        <td>${fmtD(r.avg_cost)}</td>
        <td class="dim">${fmt(r.qty * r.avg_cost)}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  function populateSuggestions(inv) {
    const dl = document.getElementById('item-suggestions');
    dl.innerHTML = inv.map(r => `<option value="${r.item}">`).join('');
  }

  // ── Toast ───────────────────────────────────────────────────────────────────
  function toast(msg, ms = 3000) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), ms);
  }

  // ── Enter key to log ────────────────────────────────────────────────────────
  ['qty','item','price'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') logTrade(); })
  );

  loadAll();
</script>
</body>
</html>
